# Une Release à chaque merge sur main : le workflow lit la version de
# Cargo.toml, crée le tag `v<version>` s'il n'existe pas encore, construit
# Quarry pour macOS (Apple Silicon et Intel), Linux et Windows, et attache
# les archives à la Release GitHub. Chaque pull request doit donc
# incrémenter la version dans Cargo.toml ; sans changement de version, rien
# n'est publié.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version et tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Le tag ${tag} existe déjà : pas de nouvelle release."
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${tag}"
            git push origin "${tag}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
            archive: Quarry-${{ needs.version.outputs.tag }}-macos-apple-silicon.zip
          # Compilé en croisé depuis le runner Apple Silicon.
          - name: macOS (Intel)
            os: macos-14
            target: x86_64-apple-darwin
            archive: Quarry-${{ needs.version.outputs.tag }}-macos-intel.zip
          - name: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: Quarry-${{ needs.version.outputs.tag }}-linux-x86_64.tar.gz
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: Quarry-${{ needs.version.outputs.tag }}-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Compilation
        run: cargo build --release --locked --target ${{ matrix.target }}

      # macOS : une vraie application Quarry.app avec son icône.
      - name: Bundle macOS
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle --locked
          cargo bundle --release --target ${{ matrix.target }}
          cd target/${{ matrix.target }}/release/bundle/osx
          # Signature ad hoc du bundle entier : sans elle, seul le binaire porte
          # la signature posée par l'éditeur de liens, les ressources et
          # Info.plist ne sont pas scellés et Gatekeeper affiche
          # « Quarry est endommagé » au lieu de proposer d'ouvrir quand même.
          codesign --force --deep --sign - Quarry.app
          codesign --verify --deep --strict --verbose=2 Quarry.app
          ditto -c -k --keepParent Quarry.app "${{ matrix.archive }}"
          mv "${{ matrix.archive }}" "$GITHUB_WORKSPACE/"

      - name: Archive Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/quarry
          cp target/${{ matrix.target }}/release/quarry dist/quarry/
          cp README.md assets/icon.png dist/quarry/
          tar -C dist -czf "${{ matrix.archive }}" quarry

      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/quarry.exe dist/Quarry.exe
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Publier la Release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Installation

            - **macOS** : dézippe, glisse `Quarry.app` dans Applications. L'application n'est pas notariée par Apple :
              au premier lancement macOS refuse de l'ouvrir ; va dans Réglages Système → Confidentialité et sécurité,
              puis clique « Ouvrir quand même » en bas de la page. En alternative, dans le Terminal :
              `xattr -dr com.apple.quarantine /Applications/Quarry.app`.
            - **Linux** : `tar xzf` puis lance `./quarry`.
            - **Windows** : dézippe et lance `Quarry.exe`. SmartScreen peut demander confirmation (exécutable non signé).

            Les connecteurs (PostgreSQL, MySQL, BigQuery…) se téléchargent depuis l'application : Gérer → Connecteurs.
