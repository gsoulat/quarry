# Semantic release à chaque push sur main. semantic-release lit les commits
# depuis le dernier tag (Conventional Commits : `feat:` → version mineure,
# `fix:`, `perf:`, `refactor:` → correctif, `BREAKING CHANGE` → majeure),
# calcule la version, met à jour Cargo.toml, Cargo.lock et CHANGELOG.md,
# commit, tague `v<version>` et crée la Release GitHub avec les notes.
# Les jobs suivants compilent Quarry depuis ce tag pour macOS (Apple
# Silicon et Intel), Linux et Windows et attachent les archives.
# Un commit sans type releasable (`ci:`, `docs:`, `chore:`…) ne publie rien.
# Le titre de la pull request devient le message du squash merge : c'est
# lui qui doit porter le type.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Version, tag et Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: ${{ matrix.name }}
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
            archive: Quarry-${{ needs.release.outputs.tag }}-macos-apple-silicon.zip
          # Compilé en croisé depuis le runner Apple Silicon.
          - name: macOS (Intel)
            os: macos-14
            target: x86_64-apple-darwin
            archive: Quarry-${{ needs.release.outputs.tag }}-macos-intel.zip
          - name: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: Quarry-${{ needs.release.outputs.tag }}-linux-x86_64.tar.gz
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: Quarry-${{ needs.release.outputs.tag }}-windows-x86_64.zip
    steps:
      # Le tag pointe sur le commit de release (Cargo.toml déjà à jour) :
      # c'est lui qu'on compile, pour que CARGO_PKG_VERSION soit la bonne.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Compilation
        run: cargo build --release --locked --target ${{ matrix.target }}

      # macOS : une vraie application Quarry.app avec son icône.
      - name: Bundle macOS
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle --locked
          cargo bundle --release --target ${{ matrix.target }}
          cd target/${{ matrix.target }}/release/bundle/osx
          # Signature ad hoc du bundle entier : sans elle, seul le binaire porte
          # la signature posée par l'éditeur de liens, les ressources et
          # Info.plist ne sont pas scellés et Gatekeeper affiche
          # « Quarry est endommagé » au lieu de proposer d'ouvrir quand même.
          codesign --force --deep --sign - Quarry.app
          codesign --verify --deep --strict --verbose=2 Quarry.app
          ditto -c -k --keepParent Quarry.app "${{ matrix.archive }}"
          mv "${{ matrix.archive }}" "$GITHUB_WORKSPACE/"

      - name: Archive Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/quarry
          cp target/${{ matrix.target }}/release/quarry dist/quarry/
          cp README.md assets/icon.png dist/quarry/
          tar -C dist -czf "${{ matrix.archive }}" quarry

      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/quarry.exe dist/Quarry.exe
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"

      - name: Attacher l'archive à la Release
        shell: bash
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ matrix.archive }}" --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notes:
    name: Notes d'installation
    needs: [release, build]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Ajouter la section Installation et marquer la Release comme dernière
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > body.md
          cat >> body.md <<'EOF'

          ## Installation

          - **macOS** : dézippe, glisse `Quarry.app` dans Applications. L'application n'est pas notariée par Apple :
            au premier lancement macOS refuse de l'ouvrir ; va dans Réglages Système → Confidentialité et sécurité,
            puis clique « Ouvrir quand même » en bas de la page. En alternative, dans le Terminal :
            `xattr -dr com.apple.quarantine /Applications/Quarry.app`.
          - **Linux** : `tar xzf` puis lance `./quarry`.
          - **Windows** : dézippe et lance `Quarry.exe`. SmartScreen peut demander confirmation (exécutable non signé).

          Les connecteurs (PostgreSQL, MySQL, BigQuery…) se téléchargent depuis l'application : Gérer → Connecteurs.
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md --latest
