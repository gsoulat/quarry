<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3756"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6e2ff"/>
      <stop offset="1" stop-color="#9db8ff"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#4d6fc9"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a68bf"/>
      <stop offset="1" stop-color="#293d7a"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff1cc"/>
      <stop offset="0.5" stop-color="#f3c77a"/>
      <stop offset="1" stop-color="#d9a456"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- bloc isométrique s=360, h=300, sommet avant coupé -->
    <polygon points="200,370 387,478 512,670 512,850 200,730" fill="url(#left)"/>
    <polygon points="512,670 637,478 824,370 824,730 512,850" fill="url(#right)"/>
    <polygon points="512,190 824,370 637,478 387,478 200,370" fill="url(#top)"/>
    <!-- la facette taillée : la lumière dans la pierre -->
    <polygon points="387,478 637,478 512,670" fill="url(#facet)" filter="url(#glow)"/>
    <!-- arêtes internes de la facette -->
    <g stroke="#fff6e0" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="512" y1="478" x2="512" y2="670"/>
      <line x1="450" y1="478" x2="512" y2="574"/>
      <line x1="574" y1="478" x2="512" y2="574"/>
    </g>
  </g>
</svg>
