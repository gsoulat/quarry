[package]
name = "quarry"
version = "0.1.0"
edition = "2024"
description = "Client de bases de données léger et multiplateforme, écrit en Rust avec iced"

[dependencies]
async-trait = "0.1.92"
directories = "6"
futures-util = "0.3.34"
gcp-bigquery-client = { version = "0.28", optional = true }
iced = { version = "0.14", features = ["canvas", "highlighter", "tokio"] }
keyring = "4"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "chrono", "uuid", "json"] }

# Binaire le plus léger possible en release.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Ne pas stripper les proc-macros : sur macOS, la dylib strippée ne se charge
# plus (« mis-aligned LINKEDIT string pool »).
[profile.release.build-override]
strip = false

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

# Pour produire Quarry.app / .msi / .deb : `cargo install cargo-bundle && cargo bundle --release`
[package.metadata.bundle]
name = "Quarry"
identifier = "fr.gsoulat.quarry"
icon = ["assets/icon.icns", "assets/icon.png"]
category = "public.app-category.developer-tools"

[features]
default = ["bigquery"]
bigquery = ["dep:gcp-bigquery-client"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
