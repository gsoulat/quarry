[package]
name = "quarry"
version = "0.4.1"
edition = "2024"
description = "Client de bases de données léger et multiplateforme, écrit en Rust avec iced"

[dependencies]
async-trait = "0.1.92"
calamine = { version = "0.36", features = ["dates"] }
chrono = "0.4"
csv = "1"
directories = "6"
futures-util = "0.3.34"
hex = "0.4"
iced = { version = "0.14", features = ["canvas", "highlighter", "tokio"] }
keyring = "4"
open = "5"
parquet = { version = "60", default-features = false, features = ["snap", "zstd", "lz4", "brotli", "flate2", "flate2-rust_backend", "json"] }
png = "0.18.1"
quarry-protocol = { git = "https://github.com/gsoulat/quarry-connectors", rev = "a6e656e", version = "0.1.0" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rfd = "0.17"
rust_xlsxwriter = "0.99"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "uuid", "json"] }
tokio = { version = "1.53.2", features = ["fs", "rt-multi-thread", "macros", "process", "net", "time", "io-util"] }

# Binaire le plus léger possible en release.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Ne pas stripper les proc-macros : sur macOS, la dylib strippée ne se charge
# plus (« mis-aligned LINKEDIT string pool »).
[profile.release.build-override]
strip = false

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

# Pour produire Quarry.app / .msi / .deb : `cargo install cargo-bundle && cargo bundle --release`
[package.metadata.bundle]
name = "Quarry"
identifier = "fr.gsoulat.quarry"
icon = ["assets/icon.icns", "assets/icon.png"]
category = "public.app-category.developer-tools"


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
